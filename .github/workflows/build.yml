# LiteMusic 自动构建 IPA（无需本地 Mac）
#
# 作用：在 GitHub 提供的免费 macOS 云主机上，
#   1) 用 xcodebuild 编译出无签名的 LiteMusic.app
#   2) 用 ldid 做 ad-hoc 伪签名（TrollStore 依赖 CoreTrust 漏洞安装，无需 Apple 开发者签名）
#   3) 打包成 LiteMusic.ipa 并作为构建产物上传
#
# 使用：把本项目推送到 GitHub 仓库即可自动触发；或到 Actions 页手动运行。

name: Build LiteMusic IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: 列出工程 scheme（诊断用）
        run: xcodebuild -list -project LiteMusic.xcodeproj

      - name: 安装 ldid（伪签名工具）
        run: brew install ldid

      - name: 编译（关闭签名）
        run: |
          xcodebuild build \
            -project LiteMusic.xcodeproj \
            -scheme LiteMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 伪签名并打包 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/LiteMusic.app"
          ldid -S "$APP/LiteMusic"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr LiteMusic.ipa Payload

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LiteMusic-IPA
          path: LiteMusic.ipa
